name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # CPU-only torch wheels keep the install small on Linux runners.
      - run: python -m pip install -e ".[worker,bench,api,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m stems_models
      # -rs lists what was skipped and why (adapter tests need downloaded model code).
      - run: python -m pytest -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build


  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[worker,api]" --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # The real API with stand-in models, the built web app, and Chromium.
      - run: npm run e2e
        working-directory: web
        env:
          STEMS_PYTHON: python
          STEMS_E2E_CHANNEL: chromium
