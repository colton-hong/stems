# Runtime defaults. Everything tunable lives here, not in code.
# Validated by stems_common.settings and cross-checked against models/registry.yaml
# by stems_models.selection (tests/test_defaults.py).

audio:
  # Every separation model in the registry runs at 44.1 kHz stereo.
  sample_rate_hz: 44100
  channels: 2
  output_format: wav # wav | flac | mp3_320 | mp3_192

separation:
  # Fraction of each chunk shared with its neighbour and crossfaded.
  overlap: 0.25
  batch_size: 1
  # How "other" is built: auto (from its model, minus guitar and piano when that model
  # is a 4-stem one) or residual (the mix minus the other five stems).
  other_method: auto
  # Residual check: level of (mix minus the sum of all six stems) relative to the mix.
  # Above residual_warn_db the stems are flagged as not adding up. A stem quieter than
  # silent_stem_db relative to the mix counts as silent. Both are uncalibrated and are
  # tuned on benchmark data in Phase 7.
  residual_warn_db: -10
  silent_stem_db: -60

uploads:
  # Proposed limits, not requirements from the brief (BLOCKED.md, decision D2).
  max_bytes: 262144000 # 250 MiB
  max_duration_seconds: 1200
  allowed_extensions: [wav, flac, mp3, m4a, aac, ogg, opus, aiff, aif]
  # Refused outside these: a 20-minute file at an extreme rate or channel count decodes
  # to many gigabytes. Proposed bounds, not measurements.
  min_sample_rate_hz: 8000
  max_sample_rate_hz: 192000
  max_channels: 8
  # The upload check runs the decoders in a child process; one that takes longer is
  # stopped and the upload refused.
  inspect_timeout_seconds: 20

retention:
  days: 7
  signed_url_ttl_seconds: 900

# The API's own timers.
api:
  # How often a job in progress has its status.json read.
  poll_interval_seconds: 1.0
  # How often the retention sweeper runs. It also runs once at startup.
  sweep_interval_seconds: 600
  # Lifetime of the owner cookie. Browsers cap cookies at 400 days.
  owner_cookie_days: 400

# Proposed limits, not requirements from the brief (BLOCKED.md, decision D7). Counted per
# API process, in memory. An upload counts when it is attempted, accepted or not.
rate_limits:
  uploads_per_owner_per_hour: 20
  uploads_per_ip_per_hour: 40
  parses_per_owner_per_minute: 20
  parses_per_ip_per_minute: 40
  # Jobs one browser may have queued or running at once.
  max_active_jobs_per_owner: 3
  # Jobs queued or running for all browsers together. The local worker runs one at a
  # time, so this is the longest queue anyone waits behind.
  max_jobs_in_progress: 12

decision:
  # Always the pinned version, never jev-latest / jev-preview.
  jev_model: jev-1.14.0
  # Below this confidence a Jev answer is ignored and the rule-based fallback is used.
  min_confidence: 0.8
  # Request parsing: a stem counts as asked for from this probability up (schema (a)'s
  # default). Uncalibrated.
  wanted_threshold: 0.7
  request_timeout_seconds: 10
  # Attempts per call in all. 429, 5xx, timeouts and network errors are retried.
  max_attempts: 3
  # Wait before the first retry, doubling each time, unless the reply carries retry-after.
  backoff_seconds: 0.5
  # A retry-after longer than this is not waited out: the rule-based fallback answers.
  max_retry_wait_seconds: 30
  # Planning without Jev: the ensemble mode for each quality target. "balanced" (also
  # used when the request names no quality) should follow the benchmark's recommendation
  # once P2.13 has one; until then it is a single model, like ensembles.default_mode.
  mode_for_quality:
    fastest: single_best
    balanced: single_best
    best_quality: full_ensemble

# Quality gate (project decision 8). Uncalibrated: tuned on benchmark data in Phase 7.
gate:
  pass_probability_min: 0.8
  score_min: 2
  confidence_min: 0.7
  max_retries_per_stem: 2
  # The rule-based scorer, which assesses a stem when Jev is absent, failing or unsure.
  # UNCALIBRATED first guesses, like the listening thresholds they sit on (P7.1).
  rules:
    # A stem at least this silent is "mostly_silent" and scores 0. This one is a level
    # measurement, so it is acted on whether or not the tagger is calibrated.
    silent_fraction_min: 0.98
    # Score on the 0-4 rubric for each bleed level the tagger estimated on the stem.
    bleed_scores: {none: 3, slight: 2, moderate: 1, severe: 0}
    # Ceiling on the score when the stem's own instrument is not heard in it.
    not_heard_score: 1
    # Score when nothing listened to the stem (no tagger), and ceiling when the tagger
    # could not tell whether the stem's own instrument is there.
    unchecked_score: 2
    # Confidence given to a verdict that rests on tagger thresholds while
    # listening.calibrated is false. It is below confidence_min on purpose: until the
    # thresholds are measured the gate does not act on them, and the stem is delivered
    # with a warning instead of being retried.
    uncalibrated_confidence: 0.5

# How tagger outputs (AudioSet class probabilities per 10-second window) become
# track_features and per-stem signals. Measured on clean and deliberately bled MoisesDB
# stems on 2026-11-24 (docs/gate-calibration.md, run gate-v1):
#   - presence on a stem passed its check: 97.1% right when it commits, on held-out tracks;
#   - bleed failed: the tagger ranks bled stems above clean ones only weakly (AUC 0.644)
#     and flags half of the clean ones.
# `calibrated` therefore stays false, and the gate does not act on what the tagger hears.
listening:
  calibrated: false
  presence:
    # A stem's score for a track: the mean of its best quarter of audible windows, so an
    # instrument that plays in only part of the track still counts.
    top_fraction: 0.25
    # Chosen on the calibration tracks: the lowest score from which "present" was right
    # 95% of the time, and the highest up to which "absent" was. Measured on stems. On a
    # full mix they do not work: a playing instrument scores far lower there, so the
    # detected_instruments of track_features are not to be relied on.
    present_min: 0.6466
    absent_max: 0.0207
  # Hearing an instrument in a full mix needs thresholds of its own, per instrument, and
  # only those that held up on held-out mixes are listed (docs/gate-calibration.md). An
  # instrument not listed here is never named in track_features, and with no entry for
  # vocals the vocal_presence stays "unknown".
  mix_presence: {}
  # Bleed on an output stem, by the tagger score of the strongest other source in it.
  # Still first guesses: the calibration found no thresholds that separate clean stems
  # from bled ones well enough to use, so these were left as they were.
  bleed:
    slight_min: 0.2
    moderate_min: 0.5
    severe_min: 0.8
  # The genre hint is given only when its class is at least this probable.
  genre_min: 0.3
  # Score of the reverberation classes. Below moderate_min the estimate is left unknown:
  # not hearing reverberation is not evidence of a dry recording.
  reverb:
    moderate_min: 0.2
    wet_min: 0.5

# Which models run for each slot, per ensemble mode.
# PROVISIONAL: these are the first-listed candidates from the project brief. No benchmark
# has been run yet. Phase 2 replaces them with measured choices and sets provisional: false.
ensembles:
  provisional: true
  basis: First-listed candidates from the project brief; not benchmarked.
  default_mode: single_best # single_best | two_model_blend | full_ensemble
  # How the members of a blend are combined: waveform | stft_magnitude | stft_min | stft_max.
  # A slot may override it with its own blend_method, and may weight its models with
  # two_model_weights and full_ensemble_weights (one number per model, in listed order).
  # No weights means equal weights. None are set: they are tuned in the benchmark (P2.12).
  blend_method: waveform
  slots:
    vocals:
      single_best: mel_roformer_kim_vocals
      two_model_blend: [mel_roformer_kim_vocals, bs_roformer_viperx_vocals]
      full_ensemble: [mel_roformer_kim_vocals, bs_roformer_viperx_vocals, bs_polarformer_vocals]
    drums:
      single_best: scnet_xl_ihf
      two_model_blend: [scnet_xl_ihf, htdemucs_ft]
      full_ensemble: [scnet_xl_ihf, scnet_large, htdemucs_ft]
    bass:
      single_best: htdemucs_ft
      two_model_blend: [htdemucs_ft, bs_roformer_sw_6stem]
      full_ensemble: [htdemucs_ft, bs_roformer_sw_6stem, scnet_xl_ihf]
    guitar:
      single_best: bs_roformer_sw_6stem
      two_model_blend: [bs_roformer_sw_6stem, mel_roformer_guitar_becruily]
      full_ensemble: [bs_roformer_sw_6stem, mel_roformer_guitar_becruily, htdemucs_6s]
    piano:
      single_best: bs_roformer_sw_6stem
      two_model_blend: [bs_roformer_sw_6stem, htdemucs_6s]
      full_ensemble: [bs_roformer_sw_6stem, htdemucs_6s]
    other:
      # A 4-stem model's "other" still contains guitar and piano. In a 6-stem job the
      # pipeline subtracts the chosen guitar and piano stems from it (PLAN.md, "Other").
      single_best: scnet_xl_ihf
      two_model_blend: [scnet_xl_ihf, scnet_large]
      full_ensemble: [scnet_xl_ihf, scnet_large, htdemucs_ft]
    vocal_split:
      single_best: mel_roformer_karaoke_aufr33_viperx
      two_model_blend: [mel_roformer_karaoke_aufr33_viperx, uvr_vr_5hp_karaoke]
      full_ensemble: [mel_roformer_karaoke_aufr33_viperx, uvr_vr_5hp_karaoke, uvr_mdxnet_kara_2]
    dereverb:
      single_best: mel_roformer_dereverb_anvuew
      two_model_blend: [mel_roformer_dereverb_anvuew, uvr_vr_deecho_dereverb]
      full_ensemble: [mel_roformer_dereverb_anvuew, uvr_vr_deecho_dereverb]
