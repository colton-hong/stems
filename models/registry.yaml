# Model registry: the single source of truth for every checkpoint the pipeline can load.
#
# - The pipeline loads models by `id`. Default model(s) per stem live in config/defaults.yaml
#   and are set from benchmark results, never from this file.
# - `licence_note` is informational only. It gates nothing (project decision 1 and 3).
# - `size_bytes` values are written by `python -m stems_models.check_sources --write`
#   (an HTTP HEAD per URL). null means the size has not been verified yet.
# - Keep `size_bytes:` on the line directly after `url:`; the checker relies on that.
# - No published SDR figures are recorded here on purpose: they use incompatible
#   protocols. Our own benchmark (bench/) is the only source of quality numbers.
#
# Field reference: models/README.md. Validated by stems_models.registry (tests/test_registry.py).

