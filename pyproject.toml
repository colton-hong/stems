[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stems"
version = "0.0.1"
description = "Web-based audio stem separator (non-commercial personal project)"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.8.30",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.2,<7",
]

# Extras are filled in by the phase that first needs them, with versions pinned
# from a real install (see PLAN.md, "Dependencies"). Nothing is listed speculatively.
[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]
# Exact pins: benchmark numbers and timings are only reproducible on known versions.
# Installed and verified on macOS arm64, Python 3.14 (PROGRESS.md P1.1). Adapter-specific
# packages (demucs, the MSST backend) are added by the tasks that first load those models.
worker = [
  "torch==2.15.0",
  "numpy==2.5.5",
  "scipy==1.18.1",
  "soundfile==0.14.0",
  "soxr==1.1.0",
  "av==19.0.2",
  "onnxruntime==1.32.0",
  # Imported by the vendored MSST model code (stems_models.vendor).
  "einops==0.8.2",
  "beartype==0.23.1",
  "rotary-embedding-torch==0.9.2",
  "librosa==1.0.1",
  "packaging==26.3",
  "PoPE-pytorch==0.2.1",
  # HT-Demucs network definition (stems_worker.adapters.demucs).
  "demucs==4.1.0",
  # Imported by the vendored UVR spectrogram code (stems_worker.adapters.vr).
  "audioread==3.1.0",
]
bench = []
api = []

[project.scripts]
separate = "stems_worker.cli:main"

[tool.setuptools.packages.find]
where = ["common", "models", "worker", "bench", "api"]
include = ["stems_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests load real checkpoints. Run them with `make test-slow` (pytest -m slow).
addopts = "-q --strict-markers -m 'not slow'"
filterwarnings = [
  # Raised inside the vendored MSST attention code on every model build.
  "ignore:.*torch.backends.cuda.sdp_kernel.*:FutureWarning",
]
markers = [
  "network: needs internet access (deselected by default; run with -m network)",
  "slow: loads real model weights; skipped unless they are downloaded",
  "gpu: needs a CUDA or MPS device",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "runs", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["stems_common", "stems_models", "stems_worker", "stems_bench", "stems_api"]
